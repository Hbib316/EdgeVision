<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>ESP32-CAM Surveillance</title>
    <style>
        :root {
            --primary: #2563eb;
            --success: #10b981;
            --danger: #ef4444;
            --warning: #f59e0b;
            --dark: #1f2937;
            --light: #f9fafb;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        }
        
        body {
            background: #111827;
            color: white;
            min-height: 100vh;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
            padding-bottom: env(safe-area-inset-bottom);
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 10px;
        }
        
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px;
            border-bottom: 1px solid #374151;
            margin-bottom: 15px;
            position: sticky;
            top: 0;
            background: #111827;
            z-index: 100;
        }
        
        .logo {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 18px;
            font-weight: bold;
        }
        
        .user-menu {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .user-info {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 14px;
        }
        
        .user-avatar {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: var(--primary);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 12px;
        }
        
        .logout-btn {
            padding: 6px 10px;
            background: rgba(255,255,255,0.1);
            border: none;
            border-radius: 6px;
            color: white;
            cursor: pointer;
            font-size: 13px;
            transition: background 0.2s;
        }
        
        .logout-btn:active {
            background: rgba(255,255,255,0.2);
        }
        
        .status-bar {
            display: flex;
            gap: 8px;
            margin-bottom: 10px;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            padding: 5px;
        }
        
        .status-bar::-webkit-scrollbar {
            display: none;
        }
        
        .status {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
            padding: 6px 10px;
            border-radius: 20px;
            background: rgba(255,255,255,0.1);
            white-space: nowrap;
            flex-shrink: 0;
        }
        
        .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            flex-shrink: 0;
        }
        
        .dot.online { 
            background: var(--success); 
            animation: pulse 2s infinite; 
        }
        .dot.offline { 
            background: var(--danger); 
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        
        .main-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 15px;
        }
        
        .sidebar {
            background: rgba(255,255,255,0.05);
            border-radius: 12px;
            padding: 15px;
        }
        
        .stats-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 12px;
            margin-bottom: 15px;
        }
        
        .stat-card {
            background: rgba(255,255,255,0.08);
            border-radius: 10px;
            padding: 15px;
            transition: transform 0.2s;
        }
        
        .stat-card:active {
            transform: scale(0.98);
        }
        
        .stat-value {
            font-size: 28px;
            font-weight: bold;
            margin: 6px 0;
        }
        
        .stat-label {
            font-size: 12px;
            color: #9ca3af;
        }
        
        .actions {
            display: grid;
            grid-template-columns: 1fr;
            gap: 10px;
        }
        
        .btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            background: var(--primary);
            color: white;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        
        .btn:active { 
            opacity: 0.7; 
        }
        .btn.danger { 
            background: var(--danger); 
        }
        .btn.warning { 
            background: var(--warning); 
            color: #000; 
        }
        
        .main-panel {
            background: rgba(255,255,255,0.05);
            border-radius: 12px;
            padding: 15px;
            max-height: 60vh;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
        }
        
        .detections-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            position: sticky;
            top: 0;
            background: rgba(31, 41, 55, 0.95);
            padding: 10px;
            margin: -15px -15px 15px -15px;
            backdrop-filter: blur(10px);
        }
        
        .detections-header h2 {
            font-size: 16px;
        }
        
        .detections-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        
        .detection-item {
            background: rgba(255,255,255,0.08);
            border-radius: 10px;
            padding: 12px;
            animation: slideIn 0.3s ease;
            border-left: 4px solid var(--primary);
        }
        
        .detection-item.new {
            border-left-color: var(--success);
            background: rgba(16, 185, 129, 0.1);
        }
        
        @keyframes slideIn {
            from { transform: translateX(-20px); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
        
        .detection-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }
        
        .detection-label {
            font-weight: bold;
            font-size: 16px;
        }
        
        .detection-time {
            font-size: 11px;
            color: #9ca3af;
        }
        
        .detection-details {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
            font-size: 12px;
            margin-top: 10px;
        }
        
        .detail-item {
            background: rgba(0,0,0,0.3);
            padding: 8px;
            border-radius: 6px;
            text-align: center;
        }
        
        .detail-label {
            color: #9ca3af;
            font-size: 10px;
        }
        
        .detail-value {
            font-weight: bold;
            margin-top: 4px;
        }
        
        .labels-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 8px;
            margin-top: 15px;
        }
        
        .label-item {
            background: rgba(255,255,255,0.05);
            border-radius: 8px;
            padding: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-left: 4px solid var(--primary);
        }
        
        .label-name {
            display: flex;
            align-items: center;
            gap: 6px;
            font-weight: 500;
            font-size: 14px;
        }
        
        .label-count {
            background: rgba(255,255,255,0.1);
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: bold;
        }
        
        /* Optimisations iPhone */
        @supports (-webkit-touch-callout: none) {
            body {
                padding-top: env(safe-area-inset-top);
            }
        }
        
        /* Mode paysage iPhone */
        @media (orientation: landscape) and (max-height: 500px) {
            .main-grid {
                grid-template-columns: 300px 1fr;
            }
            
            .header {
                padding: 8px 12px;
            }
            
            .logo {
                font-size: 16px;
            }
            
            .main-panel {
                max-height: calc(100vh - 120px);
            }
        }
        
        /* Petits écrans */
        @media (max-width: 375px) {
            .container {
                padding: 8px;
            }
            
            .detection-details {
                grid-template-columns: 1fr;
            }
            
            .user-info span {
                display: none;
            }
            
            .stat-value {
                font-size: 24px;
            }
        }
        
        /* Support du mode sombre iPhone */
        @media (prefers-color-scheme: dark) {
            :root {
                color-scheme: dark;
            }
        }
        
        /* Loading indicator */
        .loading {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        /* Pull to refresh indicator */
        .refresh-indicator {
            position: fixed;
            top: 60px;
            left: 50%;
            transform: translateX(-50%) scale(0);
            background: rgba(255,255,255,0.1);
            padding: 10px 20px;
            border-radius: 20px;
            backdrop-filter: blur(10px);
            transition: transform 0.3s;
            z-index: 1000;
        }
        
        .refresh-indicator.show {
            transform: translateX(-50%) scale(1);
        }
    </style>
</head>
<body>
    <div class="refresh-indicator" id="refreshIndicator">
        <div class="loading"></div>
    </div>
    
    <div class="container">
        <div class="header">
            <div class="logo">
                <span>📷</span>
                <span>ESP32-CAM</span>
            </div>
            
            <div class="user-menu">
                <div class="user-info">
                    <div class="user-avatar" id="userAvatar">U</div>
                    <span id="username">User</span>
                </div>
                
                <button class="logout-btn" onclick="logout()">
                    🚪
                </button>
            </div>
        </div>
        
        <div class="status-bar">
            <div class="status" id="wsStatus">
                <span class="dot offline"></span>
                <span>WebSocket</span>
            </div>
            <div class="status" id="mqttStatus">
                <span class="dot offline"></span>
                <span>MQTT</span>
            </div>
            <div class="status" id="dbStatus">
                <span class="dot offline"></span>
                <span>Base</span>
            </div>
            <div class="status" id="uptime">
                <span>🕐</span>
                <span>00:00:00</span>
            </div>
        </div>
        
        <div class="main-grid">
            <!-- Sidebar - Statistiques -->
            <div class="sidebar">
                <div class="stats-grid">
                    <div class="stat-card">
                        <div class="stat-label">Objets Détectés</div>
                        <div class="stat-value" id="statDetected">0</div>
                    </div>
                </div>
                
                <div class="actions">
                    <button class="btn" onclick="refreshStats()">
                        🔄 Actualiser
                    </button>
                    <button class="btn warning" onclick="clearHistory()">
                        🗑️ Vider historique
                    </button>
                </div>
                
                <div style="margin-top: 20px;">
                    <h3 style="margin-bottom: 12px; color: #d1d5db; font-size: 14px;">📊 Statistiques</h3>
                    <div class="labels-grid" id="labelsContainer">
                        <div style="text-align: center; padding: 15px; color: #9ca3af; font-size: 13px;">
                            Chargement...
                        </div>
                    </div>
                </div>
            </div>
            
            <!-- Main Panel - Détections -->
            <div class="main-panel">
                <div class="detections-header">
                    <h2>📡 Détections</h2>
                    <div style="color: #9ca3af; font-size: 12px;">
                        <span id="liveCount">0</span>
                    </div>
                </div>
                
                <div class="detections-list" id="detectionsList">
                    <div style="text-align: center; padding: 30px; color: #9ca3af; font-size: 13px;">
                        En attente...
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Configuration
        const WS_PROTOCOL = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
        const WS_URL = `${WS_PROTOCOL}//${window.location.host}`;
        const API_URL = '/api';
        
        // Variables d'état
        let wsConnection = null;
        let statsCache = { updated: 0 };
        let liveDetections = [];
        let connectionStartTime = Date.now();
        let labelsStats = {};
        let currentUser = null;
        let reconnectAttempts = 0;
        let touchStartY = 0;
        
        // Vérifier l'authentification
        function checkAuth() {
            const token = localStorage.getItem('token');
            if (!token) {
                window.location.href = '/login.html';
                return false;
            }
            
            try {
                const payload = JSON.parse(atob(token.split('.')[1]));
                currentUser = {
                    username: payload.username,
                    role: payload.role
                };
                
                document.getElementById('username').textContent = currentUser.username;
                document.getElementById('userAvatar').textContent = currentUser.username.charAt(0).toUpperCase();
                
                return true;
            } catch (error) {
                console.error('Token invalide:', error);
                localStorage.removeItem('token');
                window.location.href = '/login.html';
                return false;
            }
        }
        
        // Déconnexion
        function logout() {
            if (confirm('Voulez-vous vraiment vous déconnecter ?')) {
                localStorage.removeItem('token');
                window.location.href = '/login.html';
            }
        }
        
        // Initialisation
        document.addEventListener('DOMContentLoaded', () => {
            console.log('🚀 Initialisation...');
            
            if (!checkAuth()) return;
            
            connectWebSocket();
            loadStats();
            loadLabelStats();
            loadRecentDetections();
            updateUptime();
            
            setInterval(updateUptime, 1000);
            setInterval(loadStats, 5000);
            setInterval(loadLabelStats, 10000);
            setInterval(fetchServerStatus, 10000);
            
            // Pull to refresh pour iPhone
            setupPullToRefresh();
            
            console.log('✅ Prêt');
        });
        
        // Interceptor fetch pour le token
        const originalFetch = window.fetch;
        window.fetch = async function(url, options = {}) {
            const token = localStorage.getItem('token');
            
            if (token) {
                options.headers = {
                    ...options.headers,
                    'Authorization': `Bearer ${token}`
                };
            }
            
            const response = await originalFetch(url, options);
            
            if (response.status === 401) {
                localStorage.removeItem('token');
                window.location.href = '/login.html';
                return response;
            }
            
            return response;
        };
        
        // Connexion WebSocket avec gestion améliorée
        function connectWebSocket() {
            try {
                const token = localStorage.getItem('token');
                wsConnection = new WebSocket(`${WS_URL}?token=${token}`);
                
                wsConnection.onopen = () => {
                    console.log('✅ WebSocket connecté');
                    updateStatus('wsStatus', 'online', 'WebSocket');
                    reconnectAttempts = 0;
                    fetchServerStatus();
                };
                
                wsConnection.onmessage = (event) => {
                    const data = JSON.parse(event.data);
                    
                    if (data.type === 'server_status') {
                        updateServerStatus(data.status);
                    }
                    
                    if (data.type === 'detection') {
                        handleDetection(data.data);
                    }
                };
                
                wsConnection.onclose = () => {
                    console.log('❌ WebSocket déconnecté');
                    updateStatus('wsStatus', 'offline', 'WebSocket');
                    updateStatus('mqttStatus', 'offline', 'MQTT');
                    updateStatus('dbStatus', 'offline', 'Base');
                    
                    // Reconnexion exponentielle
                    const delay = Math.min(1000 * Math.pow(2, reconnectAttempts), 30000);
                    reconnectAttempts++;
                    setTimeout(connectWebSocket, delay);
                };
                
                wsConnection.onerror = (error) => {
                    console.error('WebSocket erreur:', error);
                };
            } catch (error) {
                console.error('Erreur WebSocket:', error);
            }
        }
        
        // Récupérer le statut du serveur
        async function fetchServerStatus() {
            try {
                const response = await fetch('/health');
                const status = await response.json();
                updateServerStatus(status);
            } catch (error) {
                console.error('Erreur statut:', error);
            }
        }
        
        // Mettre à jour l'affichage des statuts
        function updateServerStatus(status) {
            if (status.mqtt === 'connected') {
                updateStatus('mqttStatus', 'online', 'MQTT');
            } else {
                updateStatus('mqttStatus', 'offline', 'MQTT');
            }
            
            if (status.mongodb) {
                updateStatus('dbStatus', 'online', 'Base');
            } else {
                updateStatus('dbStatus', 'offline', 'Base');
            }
        }
        
        // Gestion d'une détection
        function handleDetection(detection) {
            liveDetections.unshift(detection);
            
            if (liveDetections.length > 30) {
                liveDetections = liveDetections.slice(0, 30);
            }
            
            renderDetections();
            updateStatsFromDetection(detection);
            
            if (detection.detected && detection.label) {
                updateLabelStats(detection.label);
            }
            
            // Vibration sur iPhone pour nouvelle détection
            if (detection.detected && 'vibrate' in navigator) {
                navigator.vibrate(100);
            }
        }
        
        // Rendu des détections
        function renderDetections() {
            const container = document.getElementById('detectionsList');
            const liveCount = document.getElementById('liveCount');
            
            liveCount.textContent = liveDetections.filter(d => d.detected).length;
            
            if (liveDetections.length === 0) {
                container.innerHTML = `
                    <div style="text-align: center; padding: 30px; color: #9ca3af; font-size: 13px;">
                        En attente...
                    </div>
                `;
                return;
            }
            
            container.innerHTML = liveDetections.map((det, index) => `
                <div class="detection-item ${index === 0 ? 'new' : ''}">
                    <div class="detection-header">
                        <span class="detection-label">
                            ${det.detected ? '🎯 ' + det.label : '⭕ Aucun objet'}
                        </span>
                        <span class="detection-time">
                            ${formatTime(new Date(det.timestamp))}
                        </span>
                    </div>
                    
                    ${det.detected ? `
                        <div class="detection-details">
                            <div class="detail-item">
                                <div class="detail-label">Position</div>
                                <div class="detail-value">${det.x},${det.y}</div>
                            </div>
                            <div class="detail-item">
                                <div class="detail-label">Confiance</div>
                                <div class="detail-value">${(det.proba * 100).toFixed(1)}%</div>
                            </div>
                        </div>
                    ` : ''}
                </div>
            `).join('');
        }
        
        // Charger les statistiques
        async function loadStats() {
            try {
                if (Date.now() - statsCache.updated < 2000 && statsCache.data) {
                    updateStatsDisplay(statsCache.data);
                    return;
                }
                
                const response = await fetch(`${API_URL}/stats`);
                const data = await response.json();
                
                statsCache = {
                    data: data,
                    updated: Date.now()
                };
                
                updateStatsDisplay(data);
            } catch (error) {
                console.error('Erreur stats:', error);
            }
        }
        
        // Charger les statistiques par label
        async function loadLabelStats() {
            try {
                const response = await fetch(`${API_URL}/labels`);
                const data = await response.json();
                
                labelsStats = data.reduce((acc, item) => {
                    acc[item._id] = item.count;
                    return acc;
                }, {});
                
                renderLabelStats();
            } catch (error) {
                console.error('Erreur labels:', error);
            }
        }
        
        // Afficher les statistiques par label
        function renderLabelStats() {
            const container = document.getElementById('labelsContainer');
            
            if (Object.keys(labelsStats).length === 0) {
                container.innerHTML = `
                    <div style="text-align: center; padding: 15px; color: #9ca3af; font-size: 13px;">
                        Aucun objet détecté
                    </div>
                `;
                return;
            }
            
            const sortedLabels = Object.entries(labelsStats)
                .sort((a, b) => b[1] - a[1]);
            
            container.innerHTML = sortedLabels.map(([label, count]) => `
                <div class="label-item">
                    <div class="label-name">
                        <span>🎯</span>
                        <span>${label || 'Inconnu'}</span>
                    </div>
                    <div class="label-count">${count}</div>
                </div>
            `).join('');
        }
        
        // Mettre à jour l'affichage des stats
        function updateStatsDisplay(data) {
            document.getElementById('statDetected').textContent = data.detected;
        }
        
        // Mise à jour des stats depuis une détection
        function updateStatsFromDetection(detection) {
            if (detection.detected) {
                const detectedEl = document.getElementById('statDetected');
                detectedEl.textContent = parseInt(detectedEl.textContent) + 1;
            }
        }
        
        // Mise à jour des stats par label
        function updateLabelStats(label) {
            if (!label) return;
            
            if (!labelsStats[label]) {
                labelsStats[label] = 0;
            }
            labelsStats[label]++;
            
            renderLabelStats();
        }
        
        // Charger les dernières détections
        async function loadRecentDetections() {
            try {
                const response = await fetch(`${API_URL}/detections?limit=10`);
                const detections = await response.json();
                
                liveDetections = detections;
                renderDetections();
            } catch (error) {
                console.error('Erreur détections:', error);
            }
        }
        
        // Vider l'historique
        async function clearHistory() {
            if (!confirm('Vider tout l\'historique ?')) return;
            
            try {
                const response = await fetch(`${API_URL}/clear`, { method: 'DELETE' });
                const result = await response.json();
                
                alert(`${result.deleted} détections supprimées`);
                
                liveDetections = [];
                labelsStats = {};
                renderDetections();
                renderLabelStats();
                loadStats();
            } catch (error) {
                console.error('Erreur suppression:', error);
                alert('Erreur lors de la suppression');
            }
        }
        
        // Fonctions utilitaires
        function updateStatus(elementId, status, text) {
            const element = document.getElementById(elementId);
            const dot = element.querySelector('.dot');
            
            dot.className = 'dot ' + status;
            element.querySelector('span:last-child').textContent = text;
        }
        
        function formatTime(date) {
            return date.toLocaleTimeString('fr-FR', {
                hour: '2-digit',
                minute: '2-digit',
                second: '2-digit'
            });
        }
        
        function updateUptime() {
            const elapsed = Date.now() - connectionStartTime;
            const hours = Math.floor(elapsed / 3600000);
            const minutes = Math.floor((elapsed % 3600000) / 60000);
            const seconds = Math.floor((elapsed % 60000) / 1000);
            
            document.getElementById('uptime').querySelector('span:last-child').textContent = 
                `${hours.toString().padStart(2, '0')}:${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
        }
        
        function refreshStats() {
            showRefreshIndicator();
            statsCache.updated = 0;
            loadStats();
            loadLabelStats();
            loadRecentDetections();
            fetchServerStatus();
        }
        
        // Pull to refresh pour iPhone
        function setupPullToRefresh() {
            const container = document.querySelector('.main-panel');
            
            container.addEventListener('touchstart', (e) => {
                touchStartY = e.touches[0].clientY;
            }, { passive: true });
            
            container.addEventListener('touchmove', (e) => {
                const touchY = e.touches[0].clientY;
                const touchDiff = touchY - touchStartY;
                
                if (container.scrollTop === 0 && touchDiff > 0) {
                    if (touchDiff > 80) {
                        showRefreshIndicator();
                    }
                }
            }, { passive: true });
            
            container.addEventListener('touchend', () => {
                const indicator = document.getElementById('refreshIndicator');
                if (indicator.classList.contains('show')) {
                    refreshStats();
                    setTimeout(() => {
                        indicator.classList.remove('show');
                    }, 1000);
                }
            });
        }
        
        function showRefreshIndicator() {
            const indicator = document.getElementById('refreshIndicator');
            indicator.classList.add('show');
            setTimeout(() => {
                indicator.classList.remove('show');
            }, 1000);
        }
        
        // Gestion des erreurs
        window.onerror = function(msg, url, lineNo, columnNo, error) {
            console.error('Erreur:', msg);
            return false;
        };
    </script>
</body>
</html>
